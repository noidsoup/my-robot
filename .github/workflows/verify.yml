name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Prefetch loops for L3 symlink (offline-safe clone)
        run: |
          if [ ! -d "$HOME/.loops" ]; then
            git clone --depth 1 https://github.com/noidsoup/loops "$HOME/.loops"
          fi

      - name: Run verify gate
        run: bash .verify.sh
